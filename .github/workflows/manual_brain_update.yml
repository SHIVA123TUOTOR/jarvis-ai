name: Build and Release Memory Binary

on:
  push:
    branches:
      - main

# Required permission to create releases and upload assets via GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build_memory_bin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Memory Binary Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_sharper_brain.py

      - name: Ensure Build File Exists
        run: |
          mkdir -p build
          touch build/memory_update.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-brain
          name: Memory Binary Update
          files: build/memory_update.bin
          overwrite_files: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
